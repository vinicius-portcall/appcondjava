workflows:
  ios-testflight:
    name: iOS - build e TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      # Grupo de variáveis criado no Codemagic em Environment variables, com
      # APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_IDENTIFIER e
      # APP_STORE_CONNECT_PRIVATE_KEY (o conteúdo do .p8).
      #
      # NÃO use "integrations:" aqui: esse campo só existe em conta Team, e
      # na conta pessoal o Codemagic recusa o arquivo inteiro com
      # "extra fields not permitted". Na conta pessoal a integração do
      # Developer Portal serve ao editor visual; o YAML lê das variáveis.
      groups:
        - appstore_credentials
      vars:
        BUNDLE_ID: "br.com.portcall.portcallApp"
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: br.com.portcall.portcallApp
      flutter: stable
      xcode: latest
      cocoapods: default
    # Sem gatilho automático de propósito enquanto o app não compila no iOS
    # pela primeira vez: cada tentativa gasta minutos da cota mensal, e as
    # primeiras tendem a falhar no CocoaPods. Dispare manualmente no painel.
    # Para voltar ao automático, reponha:
    #   triggering:
    #     events: [push]
    #     branch_patterns:
    #       - pattern: master
    #         include: true
    scripts:
      - name: Buscar certificado e perfil de provisionamento
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Instalar dependências Flutter
        script: |
          flutter packages pub get
      - name: Build iOS (release, assinado)
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - vinigato021@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        # Conta pessoal nao aceita "auth: integration" — as credenciais vem do
        # grupo appstore_credentials declarado no environment acima.
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - Testadores Vídeo Atende

  ios-adhoc-sem-conta-apple:
    name: iOS - build ad-hoc (sem TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      # Mesmo grupo do workflow de TestFlight: o fetch-signing-files abaixo
      # fala com a Apple pra criar certificado e perfil, e precisa das
      # credenciais mesmo sem publicar nada.
      groups:
        - appstore_credentials
      vars:
        # Usado pelo fetch-signing-files mais abaixo — sem isso o script
        # roda com a variável vazia e o build falha.
        BUNDLE_ID: "br.com.portcall.portcallApp"
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: br.com.portcall.portcallApp
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Buscar certificado e perfil ad-hoc
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_ADHOC \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Instalar dependências Flutter
        script: |
          flutter packages pub get
      - name: Build iOS (release, ad-hoc)
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - vinigato021@gmail.com
        notify:
          success: true
          failure: true
