workflows:
  ios-testflight:
    name: iOS - build e TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      # Grupo de variáveis criado no Codemagic em Environment variables, com
      # APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_IDENTIFIER e
      # APP_STORE_CONNECT_PRIVATE_KEY (o conteúdo do .p8).
      #
      # NÃO use "integrations:" aqui: esse campo só existe em conta Team, e
      # na conta pessoal o Codemagic recusa o arquivo inteiro com
      # "extra fields not permitted". Na conta pessoal a integração do
      # Developer Portal serve ao editor visual; o YAML lê das variáveis.
      groups:
        - appstore_credentials
      vars:
        BUNDLE_ID: "br.com.portcall.portcallApp"
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
      # Sem bloco "ios_signing" aqui de proposito: ele PROCURA um perfil de
      # provisionamento ja existente e aborta o build se nao achar — que foi
      # o que aconteceu na primeira tentativa, com o bundle recem-criado e
      # ainda sem perfil. Quem cria o perfil e o certificado e o
      # fetch-signing-files --create nos scripts abaixo.
      flutter: stable
      xcode: latest
      cocoapods: default
    # Sem gatilho automático de propósito enquanto o app não compila no iOS
    # pela primeira vez: cada tentativa gasta minutos da cota mensal, e as
    # primeiras tendem a falhar no CocoaPods. Dispare manualmente no painel.
    # Para voltar ao automático, reponha:
    #   triggering:
    #     events: [push]
    #     branch_patterns:
    #       - pattern: master
    #         include: true
    scripts:
      - name: Instalar dependencias Flutter
        script: |
          flutter packages pub get
      # TUDO numa etapa so, e nesta ordem exata. Duas licoes de builds que
      # falharam antes:
      #
      # 1) Separar em etapas perdia os perfis. O fetch-signing-files baixava
      #    tudo numa etapa e, na seguinte, o use-profiles nao encontrava nada
      #    ("Did not find matching provisioning profiles"), caia no metodo
      #    ad-hoc com certificado e Team Id vazios, e o xcodebuild recusava:
      #    "Runner requires a provisioning profile".
      #
      # 2) O use-profiles tem que vir DEPOIS do flutter build. O
      #    "flutter build" reescreve o project.pbxproj (atualiza o deployment
      #    target) e apaga a configuracao de assinatura gravada antes dele.
      - name: Build iOS assinado e exportacao do .ipa
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          flutter build ios --release --no-codesign
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - vinigato021@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        # Conta pessoal nao aceita "auth: integration" — as credenciais vem do
        # grupo appstore_credentials declarado no environment acima.
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        # Sem "beta_groups" de proposito. "Testadores Video Atende" e um grupo
        # INTERNO, e a API do App Store Connect recusa associar build a grupo
        # interno — ele ja recebe todo build automaticamente. Com a lista aqui,
        # o build inteiro terminava em vermelho ("Cannot add internal group to
        # a build") DEPOIS de ja ter compilado, assinado e subido o .ipa, o que
        # faz parecer que o build falhou quando nao falhou.
        #
        # Grupo EXTERNO (Testadores Externos) tambem nao entra aqui: ele exige
        # passar pela Beta App Review, e isso se faz uma vez pela tela do App
        # Store Connect, nao a cada build.

  ios-adhoc-sem-conta-apple:
    name: iOS - build ad-hoc (sem TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      # Mesmo grupo do workflow de TestFlight: o fetch-signing-files abaixo
      # fala com a Apple pra criar certificado e perfil, e precisa das
      # credenciais mesmo sem publicar nada.
      groups:
        - appstore_credentials
      vars:
        # Usado pelo fetch-signing-files mais abaixo — sem isso o script
        # roda com a variável vazia e o build falha.
        BUNDLE_ID: "br.com.portcall.portcallApp"
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
      # Mesmo motivo do workflow de TestFlight: quem cria o perfil ad-hoc e o
      # fetch-signing-files --create la embaixo, nao este bloco.
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Instalar dependências Flutter
        script: |
          flutter packages pub get
      # Uma etapa só, mesma ordem do workflow de TestFlight — ver o
      # comentário longo lá para o porquê de cada linha.
      - name: Build iOS assinado e exportacao do .ipa ad-hoc
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_ADHOC \
            --create
          keychain add-certificates
          flutter build ios --release --no-codesign
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - vinigato021@gmail.com
        notify:
          success: true
          failure: true
