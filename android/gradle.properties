org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m
# Necessário porque o caminho do projeto tem "ç" (OneDrive\...\Programação) — o Android
# Gradle Plugin recusa caminhos não-ASCII no Windows por padrão. Ver http://b.android.com/95744
android.overridePathCheck=true
# Só existe JDK 8 no PATH desta máquina; alguns plugins (flutter_callkit_incoming) exigem
# toolchain Java 17 exato (Gradle não aceita o JBR do Android Studio, que é Java 25, como
# substituto). Usa o Temurin 17 instalado via winget (EclipseAdoptium.Temurin.17.JDK).
org.gradle.java.home=C:\\Program Files\\Eclipse Adoptium\\jdk-17.0.20.8-hotspot
org.gradle.java.installations.paths=C:\\Program Files\\Eclipse Adoptium\\jdk-17.0.20.8-hotspot
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=false
kotlin.daemon.jvmargs=-Xmx1536m
org.gradle.parallel=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
